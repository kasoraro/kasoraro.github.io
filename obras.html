<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obras interativas · kasoraro</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="esboco.js" defer></script>
  <style>
    .obra { margin: 0 6vw 1.5rem; }
    canvas {
      display: block;
      width: 100%;
      height: 68vh;
      cursor: crosshair;
      touch-action: none;
    }
    .legenda { color: var(--suave); margin: 0 6vw 6vh; display: inline-block; }
  </style>
</head>
<body>

  <header class="topo" data-esboco="linha">
    <a href="index.html" class="marca" data-esboco="circulo">kasoraro</a>
    <ul class="menu">
      <li><a href="index.html" data-esboco="sublinhado" data-so-hover>Portfólio</a></li>
      <li><a href="loja.html" data-esboco="sublinhado" data-so-hover>Loja</a></li>
      <li><a href="obras.html" class="ativo" data-esboco="sublinhado">Interativas</a></li>
    </ul>
  </header>

  <section class="secao" style="padding-bottom: 2vh;">
    <h2 data-esboco="sublinhado">Obra interativa nº 1 — <em>Pincelada</em></h2>
  </section>

  <div class="obra" data-esboco="caixa">
    <canvas id="tela"></canvas>
  </div>
  <p class="legenda">Passe o mouse (ou o dedo) sobre a tela para pintar. Clique para trocar de paleta. Toque duas vezes para limpar.</p>

  <footer class="rodape" data-esboco="regua">
    <span>© 2026 kasoraro</span>
    <span>Mais obras em breve</span>
  </footer>

  <script>
    // ===== Obra interativa: pinceladas que seguem o movimento =====
    const tela = document.getElementById('tela');
    const ctx = tela.getContext('2d');

    const paletas = [
      ['#c4472d', '#e8a33d', '#2e4a62', '#f1d9a7'],
      ['#3d5a40', '#6b8fa3', '#1d1b18', '#d9d0c1'],
      ['#5a2e2e', '#e8a33d', '#6b8fa3', '#2e2d2b'],
    ];
    let paletaAtual = 0;
    let anterior = null;

    function ajustarTamanho() {
      const escala = window.devicePixelRatio || 1;
      tela.width = tela.clientWidth * escala;
      tela.height = tela.clientHeight * escala;
      ctx.scale(escala, escala); // o fundo fica transparente: dá pra ver as linhas do caderno
    }

    function pintar(x, y) {
      if (!anterior) { anterior = { x, y }; return; }
      const velocidade = Math.hypot(x - anterior.x, y - anterior.y);
      const cores = paletas[paletaAtual];

      // Várias "cerdas" levemente deslocadas dão textura de pincel
      for (let i = 0; i < 6; i++) {
        const desvio = (Math.random() - .5) * 14;
        ctx.strokeStyle = cores[Math.floor(Math.random() * cores.length)];
        ctx.globalAlpha = .15 + Math.random() * .25;
        ctx.lineWidth = Math.max(2, 22 - velocidade * .4) * Math.random();
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(anterior.x + desvio, anterior.y + desvio);
        ctx.lineTo(x + desvio, y + desvio);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      anterior = { x, y };
    }

    function posicao(e) {
      const r = tela.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    tela.addEventListener('pointermove', e => { const p = posicao(e); pintar(p.x, p.y); });
    tela.addEventListener('pointerleave', () => anterior = null);
    tela.addEventListener('click', () => paletaAtual = (paletaAtual + 1) % paletas.length);
    tela.addEventListener('dblclick', ajustarTamanho);
    window.addEventListener('resize', ajustarTamanho);

    ajustarTamanho();
  </script>

</body>
</html>
